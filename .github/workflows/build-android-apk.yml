name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -80
        timeout-minutes: 60

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tail -80
        continue-on-error: true
        timeout-minutes: 60

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: so-movie-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK (if exists)
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: so-movie-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload source code as zip
        uses: actions/upload-artifact@v4
        with:
          name: so-movie-source-code
          path: |
            **/*
            !**/.git/**
            !**/.gradle/**
            !**/build/**
            !**/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
