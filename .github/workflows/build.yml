name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --channel=0 "platforms;android-37" "build-tools;37.0.0" 2>/dev/null || \
          sdkmanager --channel=3 "platforms;android-37" "build-tools;37.0.0" 2>/dev/null || \
          echo "Warning: Could not install SDK 37, will try building with available SDK"
          sdkmanager --list_installed 2>/dev/null || sdkmanager --list | head -50

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-tabs-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
